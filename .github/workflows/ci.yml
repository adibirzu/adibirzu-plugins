name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No token scopes by default. Each job grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests (standard library only)
        run: python3 -m unittest discover -s tests -v
      - name: Workflow, skill and test-isolation lint
        run: python3 plugins/coding-cicd-hardening/scripts/check_workflows.py .

  sast:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-pinned tools
        run: python3 -m pip install --require-hashes -r .github/ci/requirements.txt
      - name: Ruff
        run: ruff check plugins/coding-cicd-hardening/scripts tests .github/ci
      - name: Bandit
        run: bandit --quiet --recursive plugins/coding-cicd-hardening/scripts .github/ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --silent --show-error --fail --location \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz --directory "${RUNNER_TEMP}" gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit, including merge resolutions
        # By default gitleaks reads `git log -p`, which shows no diff for a
        # merge commit. A secret typed in while resolving a conflict would be
        # skipped. --diff-merges=first-parent makes those changes visible.
        run: |
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --no-banner --verbose \
            --log-opts="--full-history --all --diff-merges=first-parent"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
