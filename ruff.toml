# The scripts are standard library only and must run on any supported Python.
target-version = "py39"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]

[lint.per-file-ignores]
# Tests use assert-free unittest, temp files and fixture strings.
"tests/*" = ["S101", "S108"]
