# Grouped weekly updates. One pull request per ecosystem keeps review cheap.
# The cooldown skips releases younger than seven days, which is the window in
# which most hijacked packages and repointed tags are caught and pulled.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/.github/ci"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      ci-tools:
        patterns:
          - "*"
