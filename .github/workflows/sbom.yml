name: sbom

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# No token scopes by default. Each job grants only what it needs.
permissions: {}

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate and validate SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-pinned validators
        run: python3 -m pip install --require-hashes -r .github/ci/requirements.txt
      - name: Generate CycloneDX 1.7 and SPDX-2.3
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 plugins/coding-cicd-hardening/scripts/generate_sbom.py . \
            --spec-version 1.7 --output-dir sbom
      - name: Validate against the official CycloneDX and SPDX-2.3 validators
        run: |
          python3 .github/ci/validate_sbom.py \
            sbom/marketplace.cdx.json sbom/marketplace.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90
